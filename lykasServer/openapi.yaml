openapi: 3.1.0
info:
  title: CarePaws API
  version: 1.0.0-in-progress
  description: >
    Pet shelter adoption and welfare management platform. This spec covers
    only the domains implemented so far (Foundation + Identity & Access +
    Pet & Shelter Operations + Adoption Pipeline + Foster & Post-Adoption
    Care + Community & Engagement + Communication + Finance); it grows one
    PR at a time as each domain in §5.3 lands — see the per-slice manifest
    for what's currently covered.
servers:
  - url: http://localhost:5000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    User:
      type: object
      properties:
        _id: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, staff, admin, super_admin] }
        status: { type: string, enum: [active, suspended, locked] }
        emailVerified: { type: boolean }
        identityVerificationStatus:
          type: string
          enum: [unverified, pending, verified, rejected]
        createdAt: { type: string, format: date-time }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        pages: { type: integer }
    Pet:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        species: { type: string, enum: [Dog, Cat, Other] }
        breed: { type: string }
        age: { type: number }
        gender: { type: string, enum: [Male, Female] }
        size: { type: string, enum: [Small, Medium, Large] }
        temperament:
          type: string
          enum: [Calm, Playful, Shy, Energetic, Affectionate, Independent]
        energyLevel: { type: string, enum: [Low, Medium, High] }
        description: { type: string }
        imageUrl: { type: string }
        status: { type: string, enum: [Available, Pending, Adopted, Foster] }
        owner: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      security: []
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email, password]
              properties:
                displayName: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/auth/login:
    post:
      security: []
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/AuthTokens"
                      - type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid credentials }
        "423": { description: Account locked (5 consecutive failed attempts) }

  /api/auth/google:
    post:
      security: []
      summary: Log in / sign up via Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid Google credential }

  /api/auth/verify-email:
    post:
      security: []
      summary: Verify an email address with the token sent by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: Verified }
        "400": { description: Invalid or expired token }

  /api/auth/forgot-password:
    post:
      security: []
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200": { description: Generic success response (does not reveal whether the email exists) }

  /api/auth/reset-password:
    post:
      security: []
      summary: Reset a password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: Password reset; all sessions revoked }
        "400": { description: Invalid or expired token }

  /api/auth/refresh:
    post:
      security: []
      summary: Exchange a refresh token for a new access/refresh token pair (rotates the refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AuthTokens" }
        "401": { description: Invalid, expired, or already-rotated refresh token }

  /api/auth/logout:
    post:
      summary: Log out (blacklists the current access token, revokes the given refresh token)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me:
    get:
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/profile:
    put:
      summary: Update the current user's profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                phone: { type: string }
                address: { type: string }
                notificationsEnabled: { type: boolean }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/sessions:
    get:
      summary: List the current user's active sessions
      responses:
        "200": { description: Active sessions }
    delete:
      summary: Revoke all sessions except (optionally) the current one
      responses:
        "200": { description: Revoked }

  /api/auth/sessions/{id}:
    delete:
      summary: Revoke one specific session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "404": { description: Session not found }

  /api/auth/login-history:
    get:
      summary: The current user's own login history (paginated)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Paginated login history }

  /api/auth/users:
    get:
      summary: "Admin: list users (search/filter/paginate)"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/users/{id}/role:
    put:
      summary: "Admin: change a user's role"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [user, staff, admin, super_admin] }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/users/{id}/status:
    put:
      summary: "Admin: change a user's status (active/suspended/locked); revokes sessions if not active"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, locked] }
                reason: { type: string }
      responses:
        "200": { description: Updated }

  /api/roles:
    get:
      summary: "Super admin: list roles"
      responses:
        "200": { description: Roles }
    post:
      summary: "Super admin: create a role"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label]
              properties:
                key: { type: string }
                label: { type: string }
                description: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        "201": { description: Created }

  /api/api-keys:
    get:
      summary: "Super admin: list API keys"
      responses:
        "200": { description: API keys }
    post:
      summary: "Super admin: create an API key (raw key returned once)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        "201": { description: "Created — raw key is only ever returned in this response" }

  /api/monitoring/api/summary:
    get:
      summary: "Admin: aggregate request volume / error rate / latency over a recent window"
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24, maximum: 168 }
      responses:
        "200": { description: Summary }

  /api/system/health:
    get:
      security: []
      summary: Health check (Mongo/Redis connectivity, uptime)
      responses:
        "200": { description: OK }

  /api/system/version:
    get:
      security: []
      summary: API name/version/environment
      responses:
        "200": { description: OK }

  /api/pets:
    get:
      security: []
      summary: Public pet catalog (search/filter/paginate)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          description: Free-text search (backed by a MongoDB text index)
          schema: { type: string }
        - name: species
          in: query
          schema: { type: string, enum: [Dog, Cat, Other] }
        - name: status
          in: query
          schema: { type: string, enum: [Available, Pending, Adopted, Foster] }
      responses:
        "200":
          description: Paginated pet list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Pet" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      summary: "Admin: create a pet (multipart, optional image field)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, species, gender]
              properties:
                name: { type: string }
                species: { type: string, enum: [Dog, Cat, Other] }
                gender: { type: string, enum: [Male, Female] }
                image: { type: string, format: binary }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/pets/admin:
    get:
      summary: "Admin: full pet list, including Adopted/Foster/soft-deleted"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Paginated pet list }

  /api/pets/my-pets:
    get:
      summary: The current user's own adopted pets
      responses:
        "200": { description: Paginated pet list }

  /api/pets/{id}:
    get:
      security: []
      summary: Get one pet (404 if soft-deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Pet }
        "404": { description: Not found }
    put:
      summary: "Admin: update a pet (multipart, optional new image)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      summary: "Admin: soft-delete a pet"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }

  /api/pets/{id}/adopt:
    post:
      summary: "Admin: finalize an adoption (sets status=Adopted, owner=userId)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties: { userId: { type: string } }
      responses:
        "200": { description: Adopted }
        "400": { description: Pet is not in an adoptable status }

  /api/pets/{id}/restore:
    post:
      summary: "Admin: restore a soft-deleted pet"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Restored }

  /api/pets/{id}/permanent:
    delete:
      summary: "Super admin: permanently delete a pet"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Permanently deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/shelters/summary:
    get:
      summary: "Admin: shelter capacity/occupancy/status aggregates"
      responses:
        "200": { description: Summary }

  /api/shelters:
    get:
      summary: "Admin: list shelters"
      responses:
        "200": { description: Shelters }
    post:
      summary: "Admin: create a shelter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        "201": { description: Created }

  /api/shelter-care/summary/{petId}:
    get:
      summary: "Staff: one pet's latest health check / feeding / behavior / cage / quarantine at a glance"
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Summary }

  /api/shelter-care/health-checks:
    post:
      summary: "Staff: log a health check"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet, condition]
              properties:
                pet: { type: string }
                condition: { type: string, enum: [Excellent, Good, Fair, Poor, Critical] }
      responses:
        "201": { description: Logged }

  /api/shelter-care/health-checks/flagged:
    get:
      summary: "Staff: health checks flagged for follow-up, across all pets"
      responses:
        "200": { description: Flagged health checks }

  /api/inventory/summary:
    get:
      summary: "Staff: item count / low-stock count / totals by category"
      responses:
        "200": { description: Summary }

  /api/inventory:
    get:
      summary: "Staff: list inventory items"
      parameters:
        - name: lowStock
          in: query
          schema: { type: boolean }
      responses:
        "200": { description: Inventory items }
    post:
      summary: "Staff: add an inventory item"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                category:
                  type: string
                  enum: [food, medical, bedding, cleaning, equipment, office, other]
      responses:
        "201": { description: Created }

  /api/inventory/{id}/adjust:
    post:
      summary: "Staff: adjust stock (restock/usage/adjustment), appends to the movements log"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, quantity]
              properties:
                type: { type: string, enum: [restock, usage, adjustment] }
                quantity:
                  type: number
                  description: Signed delta — negative for usage, positive for restock
      responses:
        "200": { description: Adjusted }
        "400": { description: Adjustment would result in negative stock }

  /api/archive:
    get:
      summary: "Super admin: list archived records"
      responses:
        "200": { description: Archived records }

  /api/archive/{collection}:
    post:
      summary: "Super admin: archive a record out of its collection entirely"
      parameters:
        - name: collection
          in: path
          required: true
          schema: { type: string, enum: [User, Pet, Shelter, InventoryItem] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                reason: { type: string }
      responses:
        "201": { description: Archived }

  /api/archive/{id}/restore:
    post:
      summary: "Super admin: restore an archived record back to its original collection"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Restored }

  /api/applications:
    post:
      summary: >
        Submit an adoption/foster application. Not in §5.3's original route
        table — added deliberately (see the controller comment) since
        nothing else creates an Application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet]
              properties:
                pet: { type: string }
                phone: { type: string }
                type: { type: string, enum: [adoption, foster] }
      responses:
        "201": { description: Submitted; the pet is put on hold (status → Pending) }
        "400": { description: Pet not available, or an existing pending application already exists }
    get:
      summary: "Admin: list applications (search/filter/paginate)"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - name: stage
          in: query
          schema: { type: string }
      responses:
        "200": { description: Paginated application list }

  /api/applications/my:
    get:
      summary: The current user's own applications
      responses:
        "200": { description: Paginated application list }

  /api/applications/{id}:
    get:
      summary: Get one application — the applicant themselves, or staff (internalNotes hidden from the applicant)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Application }
        "403": { description: Not the applicant and not staff }

  /api/applications/{id}/status:
    put:
      summary: "Admin: approve/reject/reset an application's outcome"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [pending, approved, rejected] } }
      responses:
        "200": { description: Updated; rejecting releases the pet's hold back to Available }

  /api/applications/{id}/stage:
    put:
      summary: "Admin: move the application to a new pipeline stage; appended to stageHistory"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum:
                    [
                      submitted,
                      document_review,
                      interview,
                      home_visit,
                      risk_assessment,
                      approved,
                      adoption_scheduled,
                      completed,
                      rejected,
                    ]
                note: { type: string }
      responses:
        "200": { description: Updated }

  /api/applications/{id}/vetting-status:
    get:
      summary: "Admin: readiness snapshot aggregating this application's interview/home-visit/risk-assessment outcomes"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Vetting status }

  /api/appointments:
    get:
      summary: List open/booked appointment slots
      responses:
        "200": { description: Appointments }
    post:
      summary: "Admin: create a new bookable slot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title: { type: string }
                date: { type: string, format: date-time }
      responses:
        "201": { description: Created }

  /api/appointments/{id}/enroll:
    post:
      summary: Enroll the current user into an open appointment slot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Enrolled }
        "400": { description: Slot is not open }

  /api/interviews:
    post:
      summary: "Admin: schedule an interview for an application"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application, applicant, pet, scheduledDate, method]
              properties:
                application: { type: string }
                applicant: { type: string }
                pet: { type: string }
                scheduledDate: { type: string, format: date-time }
                method: { type: string, enum: [In-person, Video call, Phone call] }
      responses:
        "201": { description: Scheduled }
    get:
      summary: "Admin: list interviews"
      responses:
        "200": { description: Interviews }

  /api/interviews/{id}/complete:
    put:
      summary: "Admin: record an interview's outcome"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties: { result: { type: string, enum: [passed, failed, pending] } }
      responses:
        "200": { description: Recorded }

  /api/home-visits:
    post:
      summary: "Admin: schedule a home visit for an application"
      responses:
        "201": { description: Scheduled }
    get:
      summary: "Admin: list home visits"
      responses:
        "200": { description: Home visits }

  /api/home-visits/{id}/complete:
    put:
      summary: "Admin: record a home visit's report and outcome"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [passed, failed, pending] }
                report:
                  type: object
                  properties:
                    safetyCheck: { type: string, enum: [Pass, Fail, "Needs Improvement"] }
                    recommendation: { type: string, enum: [Approve, Reject, "Needs Follow-up"] }
      responses:
        "200": { description: Recorded }

  /api/risk-assessments:
    post:
      summary: >
        Admin: submit a risk assessment. totalScore/riskLevel are always
        computed server-side from `scores` (§5.2's exact algorithm) — the
        request schema has no field for either, so a client cannot set them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application, applicant, pet, scores]
              properties:
                application: { type: string }
                applicant: { type: string }
                pet: { type: string }
                scores:
                  type: object
                  required:
                    [
                      housingStability,
                      financialReadiness,
                      petExperience,
                      lifestyleMatch,
                      familyCommitment,
                      knowledgeOfPet,
                    ]
                  properties:
                    housingStability: { type: integer, minimum: 1, maximum: 5 }
                    financialReadiness: { type: integer, minimum: 1, maximum: 5 }
                    petExperience: { type: integer, minimum: 1, maximum: 5 }
                    lifestyleMatch: { type: integer, minimum: 1, maximum: 5 }
                    familyCommitment: { type: integer, minimum: 1, maximum: 5 }
                    knowledgeOfPet: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "201": { description: Created, with server-computed totalScore/riskLevel }
        "400": { description: Validation failed (including unknown fields like a client-supplied totalScore) }

  /api/risk-assessments/application/{applicationId}:
    get:
      summary: "Admin: all risk assessments for one application"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Risk assessments }

  /api/adopter-profile:
    get:
      summary: "Admin: paginated adopter list with application-count aggregates"
      responses:
        "200": { description: Adopter profiles }

  /api/adopter-profile/{userId}:
    get:
      summary: "Admin: one adopter's full aggregated history (applications + risk assessments)"
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Adopter profile }

  /api/foster:
    post:
      summary: "Admin: create a foster placement (sets pet.status=Foster)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet, fosterer]
              properties:
                pet: { type: string }
                fosterer: { type: string }
                weeklyReportsRequired: { type: integer }
      responses:
        "201": { description: Created }
    get:
      summary: "Admin: list foster placements"
      responses:
        "200": { description: Foster placements }

  /api/foster/my:
    get:
      summary: The current user's own foster placements
      responses:
        "200": { description: Foster placements }

  /api/foster/{id}:
    get:
      summary: Get one foster placement — the fosterer themselves, or staff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Foster placement }
        "403": { description: Not the fosterer and not staff }

  /api/foster/{id}/end:
    put:
      summary: "Admin: end an active foster placement with an outcome"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [ADOPTED, RETURNED, EXTENDED] }
      responses:
        "200":
          description: >
            Ended. ADOPTED sets the pet to Adopted with owner=fosterer;
            RETURNED sets the pet back to Available; EXTENDED leaves the pet
            as Foster (a new placement is expected separately).

  /api/foster/{id}/can-finalize:
    get:
      summary: Whether this foster placement has met its weekly-reporting requirement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ canFinalize, weeklyReportsRequired, weeklyReportsSubmitted, reason }" }

  /api/foster/{fosterId}/reports:
    post:
      summary: Submit a weekly foster report (fosterer or staff)
      parameters:
        - name: fosterId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekNumber]
              properties: { weekNumber: { type: integer, minimum: 1 } }
      responses:
        "201": { description: Submitted; increments weeklyReportsSubmitted on the foster }

  /api/monitoring-reports:
    post:
      summary: Submit a post-adoption monthly check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet]
              properties: { pet: { type: string } }
      responses:
        "201": { description: Submitted }

  /api/monitoring-reports/flagged:
    get:
      summary: "Admin: monitoring reports flagged for follow-up"
      responses:
        "200": { description: Flagged reports }

  /api/baby-book:
    post:
      summary: Add a baby book entry for an adopted pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet, title]
              properties:
                pet: { type: string }
                title: { type: string }
                category: { type: string, enum: [Milestone, Health, "Funny Moment", Training, "First Time", General] }
      responses:
        "201": { description: Created }

  /api/baby-book/{petId}:
    get:
      summary: All baby book entries for one pet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Entries }

  /api/medical/summary/{petId}:
    get:
      summary: "Staff: a pet's 5 most recent vaccinations/vet-visits/records"
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Summary }

  /api/medical/vaccinations/upcoming:
    get:
      summary: "Staff: vaccinations due within the next N days (default 30), across all pets"
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30, maximum: 180 }
      responses:
        "200": { description: Upcoming vaccinations }

  /api/emergency-reports:
    post:
      summary: Report a stray/injured/abused/abandoned animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: { type: string, enum: [stray_animal, injured_animal, abuse_report, abandoned_animal, other] }
                description: { type: string }
      responses:
        "201": { description: Submitted }
    get:
      summary: "Admin: list emergency reports (search/filter/paginate)"
      responses:
        "200": { description: Emergency reports }

  /api/events:
    get:
      security: []
      summary: List events (public — search/filter/paginate, defaults to soonest-first)
      responses:
        "200": { description: Events }
    post:
      summary: "Admin: create an event"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title: { type: string }
                date: { type: string, format: date-time }
                maxAttendees: { type: integer }
      responses:
        "201": { description: Created }

  /api/events/{id}/register:
    post:
      summary: Register the current user for an event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201": { description: Registered }
        "400": { description: Already registered, or the event is full }
    delete:
      summary: Cancel the current user's registration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cancelled }

  /api/events/{id}/volunteers:
    post:
      summary: "Admin: assign a volunteer to an event"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volunteer]
              properties: { volunteer: { type: string }, role: { type: string } }
      responses:
        "201": { description: Assigned }

  /api/event-assignments/my:
    get:
      summary: The current user's own event-volunteer assignments (if they're a registered volunteer)
      responses:
        "200": { description: Assignments }

  /api/event-assignments/{id}/confirm:
    put:
      summary: Confirm an assignment — the assigned volunteer themselves, or staff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Confirmed }
        "403": { description: Not the assigned volunteer and not staff }

  /api/volunteers/register:
    post:
      summary: Submit a volunteer application for the current user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivation: { type: string }
                availability:
                  type: array
                  items: { type: string, enum: ["Weekday mornings", "Weekday afternoons", Weekends, Flexible] }
      responses:
        "201": { description: Submitted }
        "400": { description: An application already exists for this account }

  /api/volunteers/{id}/status:
    put:
      summary: "Admin: approve/reject/deactivate a volunteer application"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [pending, approved, rejected, inactive] } }
      responses:
        "200": { description: Updated }

  /api/volunteers/{id}/hours:
    post:
      summary: "Admin: log volunteer hours — updates both Volunteer.totalHours and User.volunteerHours"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties: { hours: { type: number, minimum: 0, maximum: 24 } }
      responses:
        "200": { description: Logged }

  /api/feedback/public:
    get:
      security: []
      summary: Public, admin-approved feedback (isPublic=true, status in [responded, resolved])
      responses:
        "200": { description: Public feedback }

  /api/feedback:
    post:
      summary: Submit feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, message]
              properties:
                type: { type: string, enum: [general, complaint, review, suggestion] }
                message: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "201": { description: Submitted }

  /api/announcements/active:
    get:
      security: []
      summary: Currently-active announcements (isActive, within startAt/endAt, matching audience)
      parameters:
        - name: audience
          in: query
          schema: { type: string, enum: [user, admin], default: user }
      responses:
        "200": { description: Active announcements }

  /api/announcements:
    post:
      summary: "Admin: create an announcement"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, message]
              properties:
                title: { type: string }
                message: { type: string }
                level: { type: string, enum: [info, warning, critical] }
                audience: { type: string, enum: [all, admin, user] }
      responses:
        "201": { description: Created }

  /api/content/public:
    get:
      security: []
      summary: Published CMS content (FAQ/policy/page/announcement), optionally filtered by type/category
      responses:
        "200": { description: Published content }

  /api/content/public/slug/{slug}:
    get:
      security: []
      summary: One published content item by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Content item }
        "404": { description: Not found or not published }

  /api/notifications/unread-count:
    get:
      summary: The current user's unread notification count
      responses:
        "200": { description: "{ count }" }

  /api/notifications/my:
    get:
      summary: The current user's notification inbox
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Notifications }

  /api/notifications/send:
    post:
      summary: "Admin: broadcast a notification to an explicit list of recipients"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients, type, title, message]
              properties:
                recipients: { type: array, items: { type: string } }
                type:
                  type: string
                  description: One of the 25 Notification.type values (§5.2) — e.g. APPLICATION_APPROVED, INTERVIEW_SCHEDULED, GENERAL
                title: { type: string }
                message: { type: string }
      responses:
        "201": { description: "{ sent, total }" }

  /api/messages/{userId}:
    get:
      summary: >
        Full message history for one conversation, oldest-first. Owner or
        staff only. REST fallback alongside the real-time Socket.io
        transport — the mobile chat screen uses this for the initial
        history load, not just live updates (§6.2).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Messages }
        "403": { description: Not the conversation owner and not staff }

  /api/chat-sessions:
    get:
      summary: "Staff-only: every conversation, most-recent-message-first — powers the admin chat console's conversation list"
      responses:
        "200": { description: Chat sessions }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notes/{entityType}/{entityId}:
    get:
      summary: "Staff: internal notes attached to an entity"
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string, enum: [Pet, User, Volunteer, InKindDonation, Shelter] }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Notes }
    post:
      summary: "Staff: attach an internal note to an entity"
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string, enum: [Pet, User, Volunteer, InKindDonation, Shelter] }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "201": { description: Added }

  /api/email-templates/{key}:
    get:
      summary: "Staff: get one email template by key"
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Template }
    put:
      summary: "Staff: update (or create, via upsert) an email template by key"
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated }

  /api/email-templates/{key}/preview:
    post:
      summary: "Staff: render a template's subject/body with sample variables substituted"
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { description: "{ subject, bodyHtml }" }

  /api/payments/webhook:
    post:
      security: []
      summary: >
        PayMongo → server. Not JWT-protected — trust boundary is the
        Paymongo-Signature HMAC check inside the handler, verified against
        the exact raw request bytes (this route is mounted behind
        express.raw(), not the global JSON parser — see server.js).
      responses:
        "200": { description: Acknowledged (processed, or a signature-verified event for an unknown payment) }
        "401": { description: Missing, malformed, tampered, or stale signature }

  /api/payments/create-checkout:
    post:
      summary: >
        Create a PayMongo Checkout Session for a donation, adoption fee, or
        event fee — the §4 production fix that extends Payment.type beyond
        just "donation".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount]
              properties:
                type: { type: string, enum: [donation, adoption_fee, event_fee] }
                amount: { type: integer, description: "PHP centavos — ₱500.00 = 50000" }
                refModel: { type: string, enum: [Application, Event] }
                refId: { type: string }
      responses:
        "201": { description: "{ payment, checkoutUrl }" }

  /api/payments/summary:
    get:
      summary: "Admin: total collected + breakdowns by status and type"
      responses:
        "200": { description: Summary }

  /api/payments/{id}/refund:
    put:
      summary: "Admin: mark a paid payment as refunded"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Refunded }
        "400": { description: Payment is not in paid status }

  /api/donations/goods:
    post:
      summary: Submit an in-kind (goods) donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                quantity: { type: number }
                dropOff: { type: string, enum: [walk_in, schedule, courier] }
      responses:
        "201": { description: Submitted }
    get:
      summary: "Admin: list in-kind donations (search/filter/paginate)"
      responses:
        "200": { description: Donations }

  /api/donations/goods/{id}/status:
    patch:
      summary: "Admin: update a donation's status (pending → confirmed → received, or cancelled)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [pending, confirmed, received, cancelled] } }
      responses:
        "200": { description: "Updated — receivedAt is stamped automatically on transition to received" }
