name: lykasServer CI

on:
  pull_request:
    paths:
      - "lykasServer/**"
  push:
    branches: [main, develop, staging]
    paths:
      - "lykasServer/**"

defaults:
  run:
    working-directory: lykasServer

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lykasServer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Audit dependencies (fail on new high/critical vulnerabilities)
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: .
        run: docker build -t lykas-server:ci ./lykasServer
